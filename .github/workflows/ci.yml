# CI: tiap push ke master / pull request → jalankan unit test.
# Tujuannya cuma "lampu hijau/merah": kode yang masuk tidak merusak build & test.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache Gradle supaya build berikutnya lebih cepat.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test
        run: ./gradlew :app:testDebugUnitTest
